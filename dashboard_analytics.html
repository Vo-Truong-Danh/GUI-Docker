<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Big Data Analytics Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #999;
            font-size: 1.1em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }
        
        .stat-card.success { border-left: 5px solid #28a745; }
        .stat-card.info { border-left: 5px solid #17a2b8; }
        .stat-card.warning { border-left: 5px solid #ffc107; }
        .stat-card.danger { border-left: 5px solid #dc3545; }
        .stat-card.primary { border-left: 5px solid #667eea; }
        
        .stat-card-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        
        .stat-card-label {
            color: #999;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-card-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .section-title {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .data-table th {
            background: #f8f9fa;
            color: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge.success { background: #d4edda; color: #155724; }
        .badge.warning { background: #fff3cd; color: #856404; }
        .badge.danger { background: #f8d7da; color: #721c24; }
        .badge.info { background: #d1ecf1; color: #0c5460; }
        
        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.2em;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.8em;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>📊 Big Data Analytics Dashboard</h1>
        <p>Tổng hợp kết quả phân tích dữ liệu Online Retail II - PySpark MLlib</p>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...
        </div>
    </div>

</div>

<script>
    const DATA_FILE = 'tmp/ml_analysis_summary.json';
    const MAX_RETRIES = 5;
    let retryCount = 0;

    async function loadData() {
        try {
            console.log('[INFO] Đang tải dữ liệu từ:', DATA_FILE);
            const response = await fetch(DATA_FILE);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            console.log('[SUCCESS] Dữ liệu tải thành công:', data);
            
            displayDashboard(data);
            return true;
        } catch (error) {
            console.error('[ERROR]', error);
            return false;
        }
    }

    async function loadDataWithRetry() {
        const loaded = await loadData();
        
        if (!loaded && retryCount < MAX_RETRIES) {
            retryCount++;
            console.log(`[RETRY] Thử lần ${retryCount}/${MAX_RETRIES} sau 2s...`);
            setTimeout(loadDataWithRetry, 2000);
        } else if (!loaded) {
            showError('Không tải được dữ liệu. Hãy chạy Spark Analysis trước.');
        }
    }

    function showError(message) {
        const content = document.getElementById('main-content');
        content.innerHTML = `
            <div class="error">
                <i class="fas fa-exclamation-circle"></i> ${message}
            </div>
        `;
    }

    function displayDashboard(data) {
        const content = document.getElementById('main-content');
        
        let html = `
            <div class="success-msg">
                <i class="fas fa-check-circle"></i> Dữ liệu tải thành công! Cập nhật lúc: ${data.analysis_date}
            </div>
            
            <!-- Main Stats -->
            <div class="stats-grid">
                <div class="stat-card success">
                    <div class="stat-card-icon">💰</div>
                    <div class="stat-card-label">Tổng Doanh Thu</div>
                    <div class="stat-card-value">$${formatNumber(data.total_revenue)}</div>
                </div>
                
                <div class="stat-card info">
                    <div class="stat-card-icon">📊</div>
                    <div class="stat-card-label">Tổng Giao Dịch</div>
                    <div class="stat-card-value">${formatNumber(data.total_records)}</div>
                </div>
                
                <div class="stat-card warning">
                    <div class="stat-card-icon">📈</div>
                    <div class="stat-card-label">Giá Trị TB/Đơn</div>
                    <div class="stat-card-value">$${formatNumber(data.avg_order_value, 2)}</div>
                </div>
                
                <div class="stat-card primary">
                    <div class="stat-card-icon">🏆</div>
                    <div class="stat-card-label">Best Model (R²)</div>
                    <div class="stat-card-value">${data.best_model_r2?.toFixed(4)}</div>
                </div>
            </div>
            
            <!-- Overview Section -->
            <div class="section">
                <div class="section-title">📋 Tổng Quan</div>
                <table class="data-table">
                    <tr>
                        <td><strong>Số Quốc Gia</strong></td>
                        <td>${data.num_countries}</td>
                        <td><strong>Số Sản Phẩm</strong></td>
                        <td>${data.num_products}</td>
                    </tr>
                    <tr>
                        <td><strong>Số Khách Hàng</strong></td>
                        <td>${data.num_customers}</td>
                        <td><strong>Trạng Thái</strong></td>
                        <td><span class="badge success">${data.analysis_status}</span></td>
                    </tr>
                </table>
            </div>
            
            <!-- Customer Segments -->
            <div class="section">
                <div class="section-title">👥 Phân Khúc Khách Hàng</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Loại Khách</th>
                            <th>Số Lượng</th>
                            <th>Tỷ Lệ %</th>
                            <th>Mô Tả</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.entries(data.customer_segments || {}).map(([segment, info]) => `
                            <tr>
                                <td><strong>${segment}</strong></td>
                                <td>${info.count}</td>
                                <td><strong>${info.percentage.toFixed(2)}%</strong></td>
                                <td>${getSegmentDescription(segment)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            
            <!-- ML Models Performance -->
            <div class="section">
                <div class="section-title">🤖 Hiệu Suất Mô Hình Machine Learning</div>
                <div class="grid-2">
                    <div>
                        <h3>Linear Regression</h3>
                        <table class="data-table">
                            <tr>
                                <td><strong>R² Score</strong></td>
                                <td>${data.lr_r2_score?.toFixed(6)}</td>
                            </tr>
                            <tr>
                                <td><strong>RMSE</strong></td>
                                <td>${data.lr_rmse?.toFixed(2)}</td>
                            </tr>
                        </table>
                    </div>
                    <div>
                        <h3>Random Forest</h3>
                        <table class="data-table">
                            <tr>
                                <td><strong>R² Score</strong></td>
                                <td>${data.rf_r2_score?.toFixed(6)}</td>
                            </tr>
                            <tr>
                                <td><strong>RMSE</strong></td>
                                <td>${data.rf_rmse?.toFixed(2)}</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Top Performers -->
            <div class="section">
                <div class="section-title">🥇 Top Performers</div>
                <table class="data-table">
                    <tr>
                        <td><strong>Top Quốc Gia</strong></td>
                        <td>${data.top_country}</td>
                        <td><strong>Doanh Thu</strong></td>
                        <td>$${formatNumber(data.top_country_revenue)}</td>
                    </tr>
                    <tr>
                        <td><strong>Top Sản Phẩm</strong></td>
                        <td>${data.top_product}</td>
                        <td><strong>Doanh Thu</strong></td>
                        <td>$${formatNumber(data.top_product_revenue)}</td>
                    </tr>
                </table>
            </div>
            
            <!-- All Metrics -->
            <div class="section">
                <div class="section-title">📊 Tất Cả Các Chỉ Số Chi Tiết</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Chỉ Số</th>
                            <th>Giá Trị</th>
                            <th>Chỉ Số</th>
                            <th>Giá Trị</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>💰 Tổng Doanh Thu</td>
                            <td>$${formatNumber(data.total_revenue)}</td>
                            <td>📦 Số Sản Phẩm</td>
                            <td>${data.num_products}</td>
                        </tr>
                        <tr>
                            <td>📊 Tổng Giao Dịch</td>
                            <td>${formatNumber(data.total_records)}</td>
                            <td>👥 Số Khách Hàng</td>
                            <td>${data.num_customers}</td>
                        </tr>
                        <tr>
                            <td>📈 Giá Trị TB/Đơn</td>
                            <td>$${formatNumber(data.avg_order_value, 2)}</td>
                            <td>🌍 Số Quốc Gia</td>
                            <td>${data.num_countries}</td>
                        </tr>
                        <tr>
                            <td>⭐ VIP Customers</td>
                            <td>${data.num_vip}</td>
                            <td>🔄 Regular Customers</td>
                            <td>${data.num_regular}</td>
                        </tr>
                        <tr>
                            <td>📍 Occasional Customers</td>
                            <td>${data.num_occasional}</td>
                            <td>🏆 Best Model</td>
                            <td>${data.best_model}</td>
                        </tr>
                        <tr>
                            <td>📍 Best Model R²</td>
                            <td>${data.best_model_r2?.toFixed(4)}</td>
                            <td>📅 Ngày Phân Tích</td>
                            <td>${data.analysis_date}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        `;
        
        content.innerHTML = html;
    }

    function formatNumber(num, decimals = 0) {
        if (!num) return '0';
        return num.toLocaleString('vi-VN', { maximumFractionDigits: decimals });
    }

    function getSegmentDescription(segment) {
        const descriptions = {
            'VIP': 'Khách hàng giá trị cao, chi tiêu lớn',
            'Regular': 'Khách hàng thường xuyên, ổn định',
            'Occasional': 'Khách hàng không thường xuyên'
        };
        return descriptions[segment] || '';
    }

    // Load data on page load
    document.addEventListener('DOMContentLoaded', loadDataWithRetry);
</script>

</body>
</html>
